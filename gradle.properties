# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# HTTP 容错（应对 CDN 并发 TLS 握手间歇性失败，经本地代理串行下载）
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.retry.initial.backoff=500

# 模组信息
mod_version=1.0.0
maven_group=com.fantasy.debug
archives_base_name=fantasy-debug

# Minecraft / Fabric 工具链版本 (1.21.11 — 最后一个混淆版本)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.18.4

# Fabric API
fabric_version=0.141.3+1.21.11