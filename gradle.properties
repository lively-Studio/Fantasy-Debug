# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# HTTP 容错（应对 CDN 并发 TLS 握手间歇性失败，经本地代理串行下载）
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.retry.initial.backoff=500

# 模组信息（各版本共享）
mod_version=1.0.0
maven_group=com.fantasy.debug
archives_base_name=fantasy-debug
