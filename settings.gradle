pluginManagement {
    repositories {
        maven { name = 'Fabric';          url = 'https://maven.fabricmc.net/' }
        maven { name = 'AliyunGradlePlugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { name = 'AliyunPublic';     url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        gradlePluginPortal()
    }
}

import org.gradle.api.artifacts.repositories.MavenArtifactRepository

def isCi = System.getenv("CI") != null

def fabricRepoUrl = isCi ? 'https://maven.fabricmc.net/' : 'http://127.0.0.1:8888/'
def mojangRepoUrl = isCi ? 'https://libraries.minecraft.net/' : 'http://127.0.0.1:8889/'

// 非 CI 环境：替换 Fabric / Mojang 走本地代理，Maven Central 走阿里云镜像
//（规避 Cloudflare 后端并发 TLS 握手间歇性失败）
if (!isCi) {
    gradle.allprojects {
        repositories.whenObjectAdded { repo ->
            if (repo instanceof MavenArtifactRepository) {
                def u = repo.url.toString()
                if (u.contains('libraries.minecraft.net')) {
                    repo.url = mojangRepoUrl
                } else if (u.contains('maven.fabricmc.net')) {
                    repo.url = fabricRepoUrl
                } else if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                    repo.url = 'https://maven.aliyun.com/repository/public'
                }
            }
        }
    }
}

rootProject.name = 'fantasy-debug'

// 多版本工程：每个 MC 版本一个子工程，源码目录在 versions/ 下
// 共享源码放在 common/，由两个版本工程一起编译。
include 'fabric-1.21.x', 'fabric-26.x'
project(':fabric-1.21.x').projectDir = file('versions/fabric-1.21.x')
project(':fabric-26.x').projectDir = file('versions/fabric-26.x')
