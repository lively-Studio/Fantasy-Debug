plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Fabric'
        url = System.getenv("CI") != null ? 'https://maven.fabricmc.net/' : 'http://127.0.0.1:8888/'
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fantasy_debug" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// 共享源码（common/，两版本通用）
sourceSets {
    main {
        java {
            srcDirs = [rootProject.file('common/src/main/java').absolutePath]
        }
        resources {
            srcDirs = [rootProject.file('common/src/main/resources').absolutePath, 'src/main/resources']
        }
    }
    client {
        java {
            srcDirs = [rootProject.file('common/src/client/java').absolutePath]
        }
        resources {
            srcDirs = [rootProject.file('common/src/client/resources').absolutePath, 'src/client/resources']
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
